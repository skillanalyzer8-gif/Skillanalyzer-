<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Analyzer - Feedback</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #080b18;
    color: white;
}

/* NAVBAR */
.navbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 50px;
    background: #0d1020;
    border-bottom: 1px solid #252a45;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo span {
    color: #7c5cff;
}

.nav-icons {
    display: flex;
    gap: 25px;
    font-size: 20px;
}

.nav-icons a {
    color: white;
    text-decoration: none;
}

/* MAIN */
.container {
    width: 90%;
    max-width: 850px;
    margin: 45px auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.header h1 span {
    color: #7c5cff;
}

.header p {
    color: #9da3b8;
    font-size: 15px;
}

/* CARD */
.feedback-card {
    background: #111528;
    border: 1px solid #292f4d;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 0 30px rgba(124, 92, 255, 0.12);
}

/* FORM */
.form-group {
    margin-bottom: 25px;
}

.form-group label {
    display: block;
    margin-bottom: 10px;
    font-size: 15px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #343b5c;
    background: #0a0e1d;
    color: white;
    outline: none;
    font-size: 14px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #7c5cff;
}

textarea {
    height: 100px;
    resize: none;
}

/* STARS */
.stars {
    display: flex;
    gap: 12px;
}

.star {
    font-size: 35px;
    color: #444b68;
    cursor: pointer;
    transition: 0.2s;
}

.star:hover,
.star.active {
    color: #ffd43b;
}

/* OPTIONS */
.options {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

.options label {
    font-weight: normal;
    cursor: pointer;
}

.options input {
    width: auto;
    margin-right: 6px;
}

/* BUTTON */
.submit-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #6c4cff, #9b6cff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(124, 92, 255, 0.35);
}

/* SUCCESS MESSAGE */
.success {
    display: none;
    text-align: center;
    padding: 30px;
}

.success .icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.success h2 {
    margin-bottom: 10px;
}

.success p {
    color: #9da3b8;
}

/* MOBILE */
@media(max-width: 600px) {

    .navbar {
        padding: 0 20px;
    }

    .container {
        width: 94%;
        margin: 25px auto;
    }

    .feedback-card {
        padding: 22px;
    }

    .header h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="logo">
        SKILL <span>ANALYZER</span>
    </div>

    <div class="nav-icons">
        <a href="Dashboard.html">🏠</a>
        <a href="#">📊</a>
        <a href="#">🏆</a>
        <a href="#">👤</a>
    </div>

</div>


<!-- MAIN CONTENT -->
<div class="container">

    <div class="header">
        <h1>SHARE YOUR <span>FEEDBACK</span></h1>
        <p>
            Your feedback helps us make Skill Analyzer smarter,
            better and more engaging.
        </p>
    </div>


    <div class="feedback-card">

        <form id="feedbackForm">

            <!-- RATING -->
            <div class="form-group">

                <label>How was your overall experience?</label>

                <div class="stars">

                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>

                </div>

                <input type="hidden" id="rating" required>

            </div>


            <!-- SKILL -->
            <div class="form-group">

                <label>Select Skill Category</label>

                <select id="skill" required>

                    <option value="">Select a skill</option>
                    <option>Software Development</option>
                    <option>UI / UX Design</option>
                    <option>Entrepreneurship</option>
                    <option>Leadership</option>

                </select>

            </div>


            <!-- LIKE -->
            <div class="form-group">

                <label>What did you like about Skill Analyzer?</label>

                <textarea
                    id="liked"
                    placeholder="Tell us about your experience..."
                    required>
                </textarea>

            </div>


            <!-- IMPROVEMENT -->
            <div class="form-group">

                <label>What can we improve?</label>

                <textarea
                    id="improve"
                    placeholder="Your suggestions..."
                    required>
                </textarea>

            </div>


            <!-- DIFFICULTY -->
            <div class="form-group">

                <label>How was the difficulty level?</label>

                <div class="options">

                    <label>
                        <input type="radio"
                               name="difficulty"
                               value="Easy"
                               required>
                        Easy
                    </label>

                    <label>
                        <input type="radio"
                               name="difficulty"
                               value="Medium">
                        Medium
                    </label>

                    <label>
                        <input type="radio"
                               name="difficulty"
                               value="Hard">
                        Hard
                    </label>

                </div>

            </div>


            <!-- RECOMMEND -->
            <div class="form-group">

                <label>Would you recommend Skill Analyzer?</label>

                <div class="options">

                    <label>
                        <input type="radio"
                               name="recommend"
                               value="Yes"
                               required>
                        👍 Yes
                    </label>

                    <label>
                        <input type="radio"
                               name="recommend"
                               value="No">
                        👎 No
                    </label>

                </div>

            </div>


            <!-- SUBMIT -->
            <button type="submit" class="submit-btn">
                🚀 SUBMIT FEEDBACK
            </button>

        </form>


        <!-- SUCCESS -->
        <div class="success" id="successMessage">

            <div class="icon">✅</div>

            <h2>Thank You!</h2>

            <p>
                Your feedback has been submitted successfully.
                We appreciate your valuable response!
            </p>

        </div>

    </div>

</div>

    <script type="module" src="Feedback.js"></script>

</body>
</html>
