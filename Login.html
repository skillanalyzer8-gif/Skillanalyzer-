<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skill Analyzer Login</title>

<link rel="stylesheet" href="Login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <!-- Background -->

    <div class="overlay"></div>

    <!-- Logo -->

    <div class="logo-section">

        <img src="Logo.jpg" class="logo">

        <h2>
            <span class="purple">SKILL</span>
            ANALYSER
        </h2>

    </div>

    <!-- Heading -->

    <div class="heading">

        <h1>Welcome</h1>

        <h1 class="back">Back!</h1>

    </div>

    <!-- Login Form -->

    <form>

        <div class="input-box">

            <i class="fa-solid fa-envelope"></i>

            <input
            type="email"
            placeholder="Email Address"
            required>

        </div>

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <i
            class="fa-solid fa-eye eye"
            onclick="togglePassword()">
            </i>

        </div>

        <div class="remember">

            <label>

                <input type="checkbox">

                Remember for 30 days

            </label>

        </div>

        <button
        type="button"
        class="login-btn"
        onclick="login()">

            LOG IN

        </button>

        <a href="#" class="forgot">

            Forgot Password?

        </a>

        <div class="signup">

            Don't have an account?

            <a href="Register.html">

                Sign up

            </a>

        </div>

    </form>

</div>

<script src="Login.js"></script>

</body>

</html>
