<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lead13 - Shadow Leader</title>

<link rel="stylesheet" href="Lead13.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- Animated Background -->

<div class="background">

<div class="grid"></div>

<div class="particles"></div>

</div>

<div class="container">

<!-- Header -->

<div class="header">

<h1>👤 SHADOW LEADER</h1>

<p>Leadership Mission 13 / 20</p>

</div>

<!-- AI Briefing -->

<div class="briefing">

<h2>🤖 AI Observation Mode</h2>

<p>

Four digital agents have entered the simulation.

Only one is the real leader.

The others unknowingly imitate the leader's behaviour.

Watch carefully.

Choose only after observing.

</p>

</div>

<!-- Arena -->

<div class="arena">

<div class="agent" id="agent1"></div>

<div class="agent" id="agent2"></div>

<div class="agent" id="agent3"></div>

<div class="agent" id="agent4"></div>

</div>

<!-- AI Status -->

<div class="status">

<h3>AI Analysis</h3>

<p id="statusText">

Scanning movement patterns...

</p>

</div>

<!-- Decision -->

<button id="observeBtn">

START OBSERVATION

</button>

</div>

<script src="Lead13.js"></script>

</body>

</html>
