<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lead15 - Time Fracture</title>

<link rel="stylesheet" href="Lead15.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- Time Background -->

<div class="background">

<div class="clockRing"></div>

<div class="particles"></div>

<div class="timeLines"></div>

</div>

<div class="container">

<!-- Header -->

<div class="header">

<h1>⏳ TIME FRACTURE</h1>

<p>Leadership Mission 15 / 20</p>

</div>

<!-- AI Brief -->

<div class="brief">

<h2>⚠ Emergency Timeline</h2>

<p>

A city-wide reactor failure is about to occur.

Time can only be reversed by five seconds.

Use your rewind wisely.

Every second you wait changes the future.

</p>

</div>

<!-- Timeline Arena -->

<div class="arena">

<div class="city">

🏙️

</div>

<div class="meteor">

☄️

</div>

<div class="timeline">

<div class="progress"></div>

</div>

</div>

<!-- AI Status -->

<div class="status">

<h3>AI Timeline Monitor</h3>

<p id="statusText">

Future is unstable...

</p>

</div>

<!-- Controls -->

<div class="controls"><div class="monitor">

    <p>Time Remaining:
    <span id="timer">20</span>s
    </p>

    <div class="timelineBar">

    <div id="timelineFill"></div>

    </div>

    </div>

    <div class="reactor">

    ☢️

    </div>

    <div class="controls">

    <button id="startBtn">

    ▶ START MISSION

    </button>

    <button id="rewindBtn">

    ⏪ REWIND 5 SECONDS

    </button>

    </div>

<button id="rewindBtn">

⏪ REWIND 5 SECONDS

</button>

</div>

</div>

<script type="module" src="Lead15.js"></script>

</body>

</html>
